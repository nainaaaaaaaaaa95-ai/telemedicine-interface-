<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Consultation</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
 integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<!-- FIXED PATH -->
<link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a href="/html/patientdash.html" class="navbar-brand">⬅ Back</a>
    <span class="navbar-text text-white">Video Consultation</span>
  </div>
</nav>

<div class="container mt-4">
  <div class="card shadow p-4 text-center">

    <h4 id="doctorName">Doctor Name</h4>
    <p id="appointmentTime" class="text-muted"></p>

    <!-- REAL CAMERA VIDEO -->
    <video id="localVideo"
           autoplay
           playsinline
           muted
           class="w-100 rounded"
           style="height:300px; background:black;">
    </video>

    <button class="btn btn-success btn-lg mt-4"
            onclick="startCall()">
      Join Video Call
    </button>

    <button class="btn btn-danger mt-2"
            onclick="endCall()">
      End Call
    </button>

  </div>
</div>

<!-- FIXED PATH -->
<script src="/js/videocall.js"></script>
</body>
</html>
