<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Telemedicine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
 integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">

      <div class="card p-4 shadow">
        <h3 class="text-center mb-3">Login</h3>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            <small id="emailError" class="text-danger d-block mt-1"></small>
          </div>

          <div class="mb-3">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password" required>
            <small id="passwordError" class="text-danger d-block mt-1"></small>
          </div>

          <div class="mb-3">
            <label>Login As</label>
            <select id="role" class="form-control" required>
              <option value="">Select Role</option>
              <option value="patient">Patient</option>
              <option value="doctor">Doctor</option>
            </select>
            <small id="roleError" class="text-danger d-block mt-1"></small>
          </div>

          <button id="submitBtn" type="submit" class="btn btn-primary w-100">
            Login
          </button>
        </form>

        <p class="text-center mt-3">
          Don’t have an account?
          <a href="/html/signup.html">Sign up</a>
        </p>

      </div>

    </div>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
