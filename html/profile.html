<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile</title>

<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  .profile-card { border-left: 4px solid #007bff; }
  .btn-group-vertical { width: 100%; }
  .action-btn { margin-bottom: 8px; }
</style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a href="javascript:history.back()" class="navbar-brand">⬅ Back</a>
    <span class="navbar-text text-white">My Profile</span>
  </div>
</nav>

<div class="container mt-4 mb-4">
  <div class="card shadow p-4 profile-card">

    <h4 class="mb-4">
      <span id="profileTitle">Profile Management</span>
      <small class="text-muted" id="roleTag"></small>
    </h4>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- PROFILE FORM -->
    <form id="profileForm">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Full Name *</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Email *</label>
          <input type="email" id="email" class="form-control" required>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Mobile Number</label>
          <input type="tel" id="mobile" class="form-control" placeholder="9876543210">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Gender</label>
          <select id="gender" class="form-select">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" id="dob" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Role</label>
          <input type="text" id="role" class="form-control" readOnly>
        </div>
      </div>

      <!-- Doctor-Only Fields -->
      <div id="doctorFields" style="display: none;">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Specialization</label>
            <input type="text" id="specialization" class="form-control" placeholder="e.g., Cardiology, Dermatology">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Years of Experience</label>
            <input type="number" id="experience" class="form-control" placeholder="e.g., 5" min="0">
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 mb-3">
            <label class="form-label">Qualification</label>
            <textarea id="qualification" class="form-control" rows="2" placeholder="e.g., MBBS, MD, DM"></textarea>
          </div>
        </div>
      </div>

      <!-- Patient-Only Fields -->
      <div id="patientFields" style="display: none;">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Blood Group</label>
            <select id="bloodGroup" class="form-select">
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Allergies</label>
            <textarea id="allergies" class="form-control" rows="2" placeholder="List any allergies (e.g., Penicillin, Peanuts)"></textarea>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea id="address" class="form-control" rows="2" placeholder="Enter your address"></textarea>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="d-flex gap-2 mt-4 flex-wrap justify-content-start">
        <button type="button" class="btn btn-info action-btn" id="readBtn" title="Refresh profile data">
          <span>🔄 Refresh</span>
        </button>
        <button type="submit" class="btn btn-primary action-btn" id="updateBtn" title="Update profile">
          <span>✏️ Update</span>
        </button>
        <button type="button" class="btn btn-secondary action-btn" id="resetBtn" title="Reset form">
          <span>↺ Reset</span>
        </button>
        <button type="button" class="btn btn-danger action-btn" id="emergencyBtn" title="Add emergency contact" style="display:none;">
          <span>🚨 Emergency</span>
        </button>
        <button type="button" class="btn btn-warning action-btn" id="changePasswordBtn" title="Change password">
          <span>🔐 Password</span>
        </button>
        <button type="button" class="btn btn-success action-btn" id="prescriptionBtn" title="View my prescriptions" style="display:none;">
          <span>📋 Prescriptions</span>
        </button>
      </div>

    </form>

  </div>

</div>

<!-- EMERGENCY CONTACT MODAL -->
<div class="modal fade" id="emergencyContactModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0">
      <div class="modal-header bg-danger text-white border-0">
        <h5 class="modal-title"><i class="fas fa-phone"></i> Emergency Contact</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="emergencyContactForm">
          <div class="mb-3">
            <label class="form-label">Contact Name</label>
            <input type="text" id="emergencyName" class="form-control" placeholder="e.g., Mother, Father, Spouse" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact Mobile Number</label>
            <input type="tel" id="emergencyMobile" class="form-control" placeholder="9876543210" required>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="saveEmergencyBtn">
          <i class="fas fa-save"></i> Save Contact
        </button>
      </div>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="changePasswordForm">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-control" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="savePasswordBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
