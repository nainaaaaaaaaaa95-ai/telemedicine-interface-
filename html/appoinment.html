<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
 integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/html/patientdash.html">⬅ Back</a>
    <span class="navbar-text text-white">Book Appointment</span>
  </div>
</nav>

<div class="container mt-4">
  <!-- Book Appointment Form -->
  <div class="card appointment-card p-4 mb-5">

    <h3 class="mb-4 text-center">Schedule Your Appointment</h3>

    <form id="bookForm">
      <!-- Doctor Selection -->
      <div class="mb-3">
        <label class="form-label">Select Doctor</label>
        <select class="form-select" id="doctor" required>
          <option value="">Choose Doctor</option>
        </select>
      </div>

      <!-- Date -->
      <div class="mb-3">
        <label class="form-label">Select Date</label>
        <input type="date" class="form-control" id="date" required>
      </div>

      <!-- Time Slot -->
      <div class="mb-3">
        <label class="form-label">Select Time</label>
        <select class="form-select" id="time" required>
          <option value="">Choose Time</option>
          <option value="10:00">10:00 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="15:00">3:00 PM</option>
          <option value="18:00">6:00 PM</option>
        </select>
      </div>

      <!-- Reason (Optional) -->
      <div class="mb-4">
        <label class="form-label">Reason for Visit (Optional)</label>
        <textarea class="form-control" id="reason" rows="3" placeholder="Describe your symptoms or reason..."></textarea>
      </div>

      <!-- Button -->
      <button type="submit" class="btn btn-success btn-lg w-100">
        Confirm Appointment
      </button>
    </form>

    <!-- Confirmation Message -->
    <div id="confirmation" class="alert alert-success mt-4 d-none"></div>

  </div>
</div>

<script src="/js/appoinment.js"></script>
</body>
</html>
