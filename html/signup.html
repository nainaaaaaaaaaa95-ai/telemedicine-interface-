<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup | Telemedicine</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
 integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card p-4 shadow">
        <h3 class="text-center mb-3">Create Account</h3>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <form id="signupForm">

          <div class="row">
            <div class="col-md-6 mb-3">
              <input type="text" id="firstName" class="form-control" placeholder="First Name" required>
            </div>

            <div class="col-md-6 mb-3">
              <input type="text" id="lastName" class="form-control" placeholder="Last Name" required>
            </div>
          </div>

          <input type="email" id="email" class="form-control mb-3" placeholder="Email Address" required>

          <input type="text" id="mobile" class="form-control mb-3" placeholder="Mobile Number (optional)">

          <input type="date" id="dob" class="form-control mb-3" placeholder="Date of Birth (optional)">

          <textarea id="address" class="form-control mb-3" placeholder="Address (optional)"></textarea>

          <select id="gender" class="form-control mb-3">
            <option value="">Select Gender (optional)</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>

          <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>

          <select id="role" class="form-control mb-3" required onchange="toggleDoctorFields()">
            <option value="">Register As</option>
            <option value="patient">Patient</option>
            <option value="doctor">Doctor</option>
          </select>

          <!-- Doctor-only fields -->
          <div id="doctorFields" style="display: none;">
            <input type="text" id="specialization" class="form-control mb-3" placeholder="Specialization (e.g., Cardiology, Dermatology)">
            
            <input type="number" id="experience" class="form-control mb-3" placeholder="Years of Experience" min="0" max="70">
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Sign Up
          </button>

        </form>

        <p class="text-center mt-3">
          Already have an account?
          <a href="/html/login.html">Login</a>
        </p>

      </div>

    </div>
  </div>
</div>

<script src="/js/signup.js"></script>
</body>
</html>
